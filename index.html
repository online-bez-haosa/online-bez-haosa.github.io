<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мария · реклама и чат-боты</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marck+Script&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Цвета с карточек тарифов Маши: крем, песок, золото, тёмный шоколад */
    --bg: #F6EFE5;
    --sand: #EADCC9;
    --card: #FFFBF4;
    --line: rgba(122, 82, 38, .18);
    --text: #2E2118;
    --about: #5A4737;
    --muted: #7D6A57;
    --gold: #A67A3F;
    --gold-deep: #7A5226;
    --gold-light: #E9CFA0;
    --gold-text: linear-gradient(100deg, #6E4A20 0%, #B98E52 42%, #D9B981 55%, #7A5226 100%);
    --gold-frame: linear-gradient(135deg, #E9CFA0 0%, #A67A3F 38%, #F3E2C1 62%, #8A6230 100%);
    --btn: linear-gradient(100deg, #3A2A1E 0%, #5B412C 100%);
    --btn-text: #FBF0DE;
    --shadow: rgba(92, 63, 30, .18);
    --main-btn: #4A3424;
    --main-btn-text: #FBF0DE;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    color: var(--text); background: var(--bg);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14.5px; line-height: 1.55; min-height: 100vh; overflow-x: hidden;
    font-variant-numeric: lining-nums; /* у Playfair цифры по умолчанию «пляшут», для цен нужны ровные */
  }
  #app { position: relative; max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; }
  .todo { background: rgba(214, 41, 92, .12); color: #B51D4C; border-radius: 4px; padding: 0 3px; }
  .serif { font-family: "Playfair Display", Georgia, serif; }

  /* ===== Шапка как на карточках тарифов: огромное золотое слово, фото поверх него, атлас ===== */
  .hero { position: relative; margin: 0 -16px; overflow: hidden; background: linear-gradient(170deg, #FBF5EC 0%, #F1E5D4 62%, var(--bg) 100%); }
  .satin { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-stage { position: relative; height: 584px; }
  .hero-top { position: relative; z-index: 4; padding: 18px 16px 0; animation: rise .8s cubic-bezier(.2,.8,.3,1) backwards; }
  .hero-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 7px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #F3DFB9; background: var(--btn); box-shadow: 0 6px 14px var(--shadow); }
  .hero-badge svg { width: 20px; height: 20px; }
  .hero-title {
    margin-top: 12px; font-family: "Playfair Display", Georgia, serif; font-weight: 700;
    font-size: clamp(34px, 10.4vw, 48px); line-height: 1.06; letter-spacing: -.01em;
  }
  .hero-title em {
    font-weight: 600; background: linear-gradient(100deg, #6E4A20 0%, #9C7238 35%, #C49A5C 50%, #9C7238 65%, #6E4A20 100%);
    background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
  }
  /* Фото вырезано, снизу растворяется в фоне и едва заметно «дышит». drop-shadow сюда нельзя: маска его обрежет */
  .hero-figure {
    position: absolute; left: -24px; top: 186px; bottom: 0; z-index: 2; width: min(70vw, 330px); overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 99%); mask-image: linear-gradient(180deg, #000 80%, transparent 99%);
    animation: rise 1s .15s cubic-bezier(.2,.8,.3,1) backwards;
  }
  .hero-figure img { display: block; width: 100%; height: auto; transform-origin: 40% 20%; animation: breathe 9s ease-in-out infinite alternate; }

  /* Коричневый развод за Машей */
  .swirl {
    position: absolute; left: -30px; top: 150px; z-index: 0; width: calc(100% + 60px); height: 430px; pointer-events: none; will-change: transform;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24%, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 24%, #000 72%, transparent 100%);
    transform-origin: 30% 50%; animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: rotate(-2deg) translateX(-6px); } to { transform: rotate(2.5deg) translateX(8px); } }

  /* Рабочее место справа: ноутбук, в него прилетают заявки */
  .desk { position: absolute; right: -6px; bottom: 26px; z-index: 3; width: 272px; animation: rise 1s .35s cubic-bezier(.2,.8,.3,1) backwards; }
  .desk svg { display: block; width: 100%; height: auto; overflow: visible; }
  .lap-num { font-family: "Playfair Display", Georgia, serif; font-size: 36px; font-weight: 700; fill: #F3DFB9; }
  .lap-num.bump { animation: flash .6s ease; }
  .lap-label { font-size: 11px; font-weight: 600; fill: #D8C4A6; }
  .lap-bot { font-size: 10.5px; font-weight: 600; fill: #E8DAC7; }
  .lap-dot { fill: #E9CFA0; animation: lamp 1.2s infinite; }
  @keyframes flash { 40% { fill: #FFFFFF; } }

  /* Заявки прилетают сверху и опускаются в экран */
  .pop {
    position: absolute; right: 12px; top: 196px; z-index: 5; width: 176px; display: flex; gap: 8px; align-items: center;
    padding: 7px 10px 7px 7px; border-radius: 15px; background: rgba(255, 251, 244, .97);
    box-shadow: 0 10px 22px rgba(70, 45, 20, .22); font-size: 12.5px; line-height: 1.25; font-weight: 600;
    opacity: 0; animation: fly 9s infinite;
  }
  .pop small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .pop .ava { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--btn-text); background: var(--btn); }
  .pop .ava.gold { background: var(--gold-frame); color: var(--text); }
  .pop.p1 { animation-delay: .4s; }
  .pop.p2 { animation-delay: 3.4s; }
  .pop.p3 { animation-delay: 6.4s; }
  @keyframes fly {
    0% { opacity: 0; transform: translate(34px, -16px) scale(.9); }
    4%, 19% { opacity: 1; transform: none; }
    31% { opacity: 1; transform: translateY(190px) scale(.82); }
    35%, 100% { opacity: 0; transform: translateY(232px) scale(.4); }
  }

  /* Подпись возле фото */
  .hero-name { position: absolute; left: 14px; bottom: 16px; z-index: 4; padding: 6px 14px 8px; border-radius: 16px; line-height: 1; background: rgba(255, 251, 244, .94); box-shadow: 0 10px 24px rgba(70, 45, 20, .2); }
  .hero-name b { display: block; font-family: "Marck Script", cursive; font-size: 30px; font-weight: 400; color: var(--gold-deep); }
  .hero-name span { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.045); } }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(12px) scale(.94); }
    5%, 66% { opacity: 1; transform: none; }
    72%, 100% { opacity: 0; transform: translateY(-6px); }
  }
  .about { position: relative; margin-top: 14px; color: var(--about); font-size: 15px; line-height: 1.6; }
  .about b { color: var(--text); font-weight: 700; }

  .nav {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
    margin: 16px -16px 0; padding: 10px 16px;
    background: rgba(246, 239, 229, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    color: var(--gold-deep); background: var(--card); border: 1px solid var(--line);
  }
  .chip.hot { color: var(--btn-text); background: var(--btn); border-color: transparent; }
  .chip:active { background: var(--sand); }

  section { margin-top: 34px; scroll-margin-top: 62px; }
  h2 { font-family: "Playfair Display", Georgia, serif; font-size: 29px; font-weight: 700; line-height: 1.12; margin-bottom: 6px; }
  h2 em { font-weight: 600; color: var(--gold); }
  .h2-note { color: var(--muted); font-size: 14px; margin-bottom: 16px; }

  .btn {
    display: block; width: 100%; text-align: center; padding: 14px; border: 0; border-radius: 14px;
    background: var(--btn); color: var(--btn-text); font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .btn:active { opacity: .88; }
  .btn.ghost { background: transparent; color: var(--gold-deep); border: 1px solid rgba(166, 122, 63, .55); }

  /* ===== Барабан ===== */
  .game-wrap { margin-top: 24px; padding: 1.5px; border-radius: 26px; background: var(--gold-frame); box-shadow: 0 16px 36px var(--shadow); scroll-margin-top: 62px; }
  .game { border-radius: 25px; padding: 20px 16px 18px; background: linear-gradient(165deg, #FFF9EF 0%, #F3E6D2 100%); }
  .game h3 { font-family: "Playfair Display", Georgia, serif; font-size: 27px; font-weight: 700; line-height: 1.12; text-align: center; }
  .game h3 em { font-weight: 600; color: var(--gold); }
  .game-text { margin-top: 8px; text-align: center; font-size: 14px; color: var(--about); }

  .machine { position: relative; margin-top: 16px; padding: 14px 12px; border-radius: 20px; background: var(--btn); box-shadow: inset 0 2px 10px rgba(0,0,0,.35); }
  .lamps { position: absolute; left: 22px; right: 22px; height: 5px; display: flex; justify-content: space-between; }
  .lamps.t { top: 5px; } .lamps.b { bottom: 5px; }
  .lamps i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-light); opacity: .45; }
  .machine.spinning .lamps i { animation: lamp .5s infinite; }
  .machine.spinning .lamps i:nth-child(even) { animation-delay: .25s; }
  .machine.won .lamps i { opacity: 1; box-shadow: 0 0 6px #FFE3A8; }
  @keyframes lamp { 0%, 100% { opacity: .25; } 50% { opacity: 1; box-shadow: 0 0 6px #FFE3A8; } }
  .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .reel {
    position: relative; height: 86px; overflow: hidden; border-radius: 12px;
    background: linear-gradient(180deg, #E4D2B7 0%, #FFFBF4 28%, #FFFBF4 72%, #E4D2B7 100%);
  }
  .machine.won .reel { outline: 2px solid var(--gold-light); }
  .strip { will-change: transform; }
  .sym {
    height: 86px; display: grid; place-items: center;
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 31px; color: var(--text);
  }
  .sym.s30 { color: #8A5A1E; }
  .attempts { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .key { width: 28px; height: 15px; display: block; transition: opacity .3s; }
  .key.used { opacity: .22; filter: grayscale(1); }
  .game-status { min-height: 21px; margin-top: 8px; text-align: center; font-size: 14px; font-weight: 600; color: var(--gold-deep); }
  .spin-btn { margin-top: 8px; padding: 16px; font-size: 16px; }
  .spin-btn[disabled] { opacity: .55; cursor: default; }

  /* Купон */
  .coupon { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--card); border: 1.5px dashed var(--gold); text-align: center; }
  .coupon-label { font-size: 12px; font-weight: 700; color: var(--muted); }
  .coupon-sum {
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 60px; line-height: 1.05;
    background: var(--gold-text); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .coupon-rows { margin-top: 8px; font-size: 13.5px; color: var(--about); }
  .coupon-rows b { color: var(--text); }
  .coupon-pick { margin: 14px 0 8px; font-size: 13px; font-weight: 700; }
  .picks { display: grid; gap: 6px; margin-bottom: 12px; }
  .pick { padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; text-align: left; }
  .pick.on { border-color: var(--gold-deep); background: var(--sand); }
  .coupon-hint { margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  .sorry { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--line); text-align: center; }
  .sorry h4 { font-family: "Playfair Display", Georgia, serif; font-size: 21px; font-weight: 700; line-height: 1.2; margin-bottom: 6px; }
  .sorry p { font-size: 14px; color: var(--about); margin-bottom: 12px; }

  details.rules { margin-top: 12px; font-size: 12.5px; color: var(--muted); }
  details.rules summary { cursor: pointer; text-align: center; font-weight: 600; list-style: none; }
  details.rules summary::-webkit-details-marker { display: none; }
  details.rules ul { list-style: none; margin-top: 8px; }
  details.rules li { margin: 4px 0; }

  /* Панель только для просмотра прототипа */
  .demo { margin-top: 12px; padding: 10px 12px; border: 1px dashed #B51D4C; border-radius: 12px; background: #fff; }
  .demo-title { font-size: 11.5px; font-weight: 700; color: #B51D4C; margin-bottom: 7px; }
  .demo-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .demo button { padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 12.5px; font-weight: 600; cursor: pointer; }
  .demo button.on { background: var(--text); color: #fff; }

  /* ===== Услуги: тёмные плитки с золотым значком, сразу видно, что это кнопка ===== */
  .service { border-radius: 22px; margin-bottom: 12px; overflow: hidden; cursor: pointer; scroll-margin-top: 66px; background: var(--btn); color: var(--btn-text); box-shadow: 0 14px 30px var(--shadow); }
  .service-top { display: grid; grid-template-columns: 62px 1fr; gap: 4px 14px; padding: 18px 16px 16px; }
  .service-icon { width: 62px; height: 62px; padding: 2px; border-radius: 18px; background: var(--gold-frame); }
  .service-icon div { width: 100%; height: 100%; border-radius: 16px; display: grid; place-items: center; background: #33241A; }
  .service-icon svg { width: 40px; height: 40px; }
  .service-title { font-family: "Playfair Display", Georgia, serif; font-size: 22px; font-weight: 700; line-height: 1.14; color: #F3DFB9; }
  .service-short { grid-column: 1 / -1; margin-top: 10px; font-size: 14px; line-height: 1.5; color: #E8DAC7; }
  .service-foot { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
  .service-price { font-size: 16px; font-weight: 700; color: #F3DFB9; }
  .service-open { flex: none; padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 700; color: var(--text); background: linear-gradient(100deg, #F0DBB2, #CFA868); }
  .service.open .service-open { background: rgba(255,255,255,.14); color: var(--btn-text); }
  .service-more { display: none; padding: 16px; cursor: default; color: var(--text); background: var(--card); }
  .service.open .service-more { display: block; }
  /* Вторая линия услуг и тарифы: светлые плитки того же устройства */
  .service.small { background: var(--card); color: var(--text); border: 1px solid rgba(166, 122, 63, .5); box-shadow: 0 6px 18px rgba(92, 63, 30, .1); }
  .service.small .service-top { padding: 14px; }
  .service.small .service-title { font-size: 18px; color: var(--text); }
  .service.small .service-short { margin-top: 6px; color: var(--about); }
  .service.small .service-price { color: var(--gold-deep); }
  .service.small .service-more { padding-top: 0; }
  .service.small.open .service-open { background: var(--sand); color: var(--text); }
  .tile-sub { font-size: 12.5px; font-weight: 600; color: var(--muted); margin-top: 3px; }
  .tile-card { display: block; width: 100%; border-radius: 12px; margin-bottom: 12px; }
  .service-more p { font-size: 14px; color: var(--about); margin-bottom: 12px; }
  .more-label { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .service-more ul { list-style: none; margin-bottom: 14px; }
  .service-more li { position: relative; padding-left: 22px; margin: 6px 0; font-size: 14px; }
  .service-more li::before { content: ""; position: absolute; left: 3px; top: 7px; width: 8px; height: 8px; transform: rotate(45deg); background: var(--gold); }
  .opts { display: grid; gap: 6px; margin-bottom: 14px; }
  .opt { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 10px 12px; border-radius: 12px; background: #F4EADB; font-size: 14px; }
  .opt small { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  .opt b { flex: none; color: var(--text); font-weight: 700; }
  .also-title { font-size: 14px; font-weight: 700; color: var(--gold-deep); margin: 20px 0 8px; }
  .pay-note { font-size: 13px; color: var(--muted); margin-top: 10px; text-align: center; }

  /* ===== Кейсы: потратили → получили ===== */
  .case { padding: 14px; margin-bottom: 10px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .case-head { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
  .case-flow { display: grid; grid-template-columns: 1fr 22px 1fr; align-items: center; gap: 6px; }
  .case-flow small { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 1px; }
  .case-spent { font-size: 19px; font-weight: 700; white-space: nowrap; }
  .case-arrow { color: var(--gold); font-size: 20px; font-weight: 700; text-align: center; }
  .case-got { font-family: "Playfair Display", Georgia, serif; font-size: 30px; font-weight: 700; line-height: 1.05; color: var(--gold-deep); white-space: nowrap; }
  .case-note { margin-top: 8px; font-size: 13.5px; color: var(--about); }
  .cases-note { margin-top: 2px; padding: 10px 12px; border-radius: 12px; background: #F4EADB; font-size: 13px; color: var(--about); }
  .link-row { display: block; margin-top: 10px; padding: 12px; text-align: center; border-radius: 14px; border: 1px solid rgba(166, 122, 63, .55); font-size: 14px; font-weight: 700; color: var(--gold-deep); cursor: pointer; }

  /* ===== Полезные посты ===== */
  .useful-group { margin: 16px 0 8px; font-size: 14px; font-weight: 700; color: var(--gold-deep); }
  .list { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; }
  .item { display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .item:last-child { border-bottom: 0; }
  .item:active { background: var(--sand); }
  .item-icon { flex: none; width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: #F4EADB; border: 1px solid rgba(166, 122, 63, .4); }
  .item-icon svg { width: 28px; height: 28px; }
  .item-main { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 700; line-height: 1.3; }
  .item-desc { margin-top: 2px; font-size: 12.5px; line-height: 1.35; color: var(--muted); }
  .item-arrow { flex: none; font-size: 19px; color: var(--gold); }

  /* ===== Отзывы ===== */
  .reviews { display: flex; gap: 10px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .reviews::-webkit-scrollbar { display: none; }
  .review { flex: none; width: 84%; display: flex; flex-direction: column; scroll-snap-align: center; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .review .quote { font-family: "Playfair Display", Georgia, serif; font-size: 44px; line-height: .7; height: 22px; color: var(--gold); }
  .review p { flex: 1; font-size: 14px; }
  .review .who { margin-top: 10px; font-size: 12.5px; font-weight: 700; color: var(--gold-deep); }

  /* ===== Удалёнка: отдельный по настроению блок на песочном фоне ===== */
  .remote { margin: 40px -16px 0; padding: 30px 16px 24px; background: linear-gradient(180deg, var(--sand) 0%, #F1E6D6 100%); scroll-margin-top: 50px; }
  .remote-head { display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
  .remote-photo { flex: none; width: 82px; height: 82px; padding: 2px; border-radius: 50%; background: var(--gold-frame); }
  .remote-photo img { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
  .remote h2 { margin: 0; font-size: 26px; }
  .remote-text { color: var(--about); font-size: 14.5px; margin-bottom: 16px; }
  .key-offer { display: flex; gap: 12px; align-items: center; padding: 14px; margin-bottom: 18px; border-radius: 16px; background: var(--card); border: 1px solid rgba(166, 122, 63, .45); cursor: pointer; }
  .key-offer svg { flex: none; width: 56px; height: 30px; }

function haptic(kind) {
  if (!inTelegram || !tg.HapticFeedback) return;

      ${s.icon ? `<div class="service-icon"><div>${icon(s.icon)}</div></div>` : ""}
      <div>
        <div class="service-title">${esc(s.title)}</div>
        ${s.sub ? `<div class="tile-sub">${esc(s.sub)}</div>` : ""}
      </div>
      <div class="service-short">${esc(s.short)}</div>
      <div class="service-foot">
        <div class="service-price">${esc(s.price)}</div>
        <div class="service-open" data-label>${esc(s.openLabel || "Что входит и цены ↓")}</div>
      </div>
    </div>
    <div class="service-more">
      ${s.card ? `<img class="tile-card" src="${esc(s.card)}" alt="${esc(s.sub || s.title)}" loading="lazy">` : ""}

/* --------- Барабан ---------
   Результат выбирается ДО вращения и сразу сохраняется, поэтому закрыть приложение
   посреди кручения и вернуть попытку нельзя. В Telegram всё лежит в облаке (CloudStorage),
   у каждого человека своё, переустановка не помогает. В обычном браузере такой памяти нет,
   поэтому с demo: false играть можно только внутри Telegram. */
const G = CONFIG.game;
const STORE_KEY = "game_" + G.gameId;
const REEL_H = 86;
let state = { left: G.attempts, win: null, played: false };
let forced = null; // только для просмотра: что выпадет на следующем кручении
let spinning = false;
let chosenService = null;

const cloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") && tg.CloudStorage;

function loadState() {
  return new Promise(resolve => {
    const local = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } };
    if (!cloud) return resolve(local());
    cloud.getItem(STORE_KEY, (err, val) => {
      if (err || !val) return resolve(local());
      try { resolve(JSON.parse(val)); } catch (e) { resolve(local()); }
    });
  });
}
function saveState() {
  const s = JSON.stringify(state);
  try { localStorage.setItem(STORE_KEY, s); } catch (e) {}
  if (cloud) cloud.setItem(STORE_KEY, s);
}

function pickOutcome() {
  if (forced !== null) { const f = forced; forced = null; return f; }
  let r = Math.random();
  for (const p of G.symbols) { if (r < G.odds[p]) return p; r -= G.odds[p]; }
  return 0;
}
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function faces(outcome) {
  if (outcome) return [outcome, outcome, outcome];
  // Не совпало: случайные числа, но не три одинаковых
  let f;
  do { f = [rnd(G.symbols), rnd(G.symbols), rnd(G.symbols)]; } while (f[0] === f[1] && f[1] === f[2]);
  return f;
}
const symHtml = p => `<div class="sym s${p}">${p}%</div>`;

function setStrip(i, target, long) {
  const strip = document.getElementById("strip" + i);
  const before = [];
  const count = long ? 14 + i * 6 : 0;
  for (let k = 0; k < count; k++) before.push(rnd(G.symbols));
  strip.style.transition = "none";
  strip.style.transform = "translateY(0)";
  strip.innerHTML = [...before, target].map(symHtml).join("");
  return { strip, distance: count * REEL_H };
}

function userTag() {
  const u = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (!u) return "твой ник в Telegram";
  return u.username ? "@" + u.username : [u.first_name, u.last_name].filter(Boolean).join(" ");
}
function makeCode(percent) {
  const u = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const base = u ? u.id : Math.floor(Math.random() * 1e9);
  return "OBH-" + percent + "-" + Number(base).toString(36).toUpperCase().slice(-5);
}
const dateText = ts => new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });

function renderGame() {
  document.getElementById("attempts").innerHTML = `Попытки ${Array.from({ length: G.attempts }, (_, i) => keySvg(i < state.left ? "" : "used")).join("")}`;
  const btn = document.getElementById("spin");
  const result = document.getElementById("result");
  const machine = document.getElementById("machine");
  machine.classList.toggle("won", !!state.win);

  if (!inTelegram && !G.demo) {
    btn.style.display = "none";
    result.innerHTML = `<div class="sorry"><h4>Играть можно в Telegram</h4><p>Так барабан запомнит твои попытки.</p></div>`;
    return;
  }
  if (state.win) {
    btn.style.display = "none";
    const expired = Date.now() > state.win.until;
    const services = [...CONFIG.also, ...CONFIG.services];
    result.innerHTML = expired
      ? `<div class="sorry"><h4>Срок скидки закончился</h4><p>Она действовала до ${esc(dateText(state.win.until))}. Напиши мне, если всё ещё актуально.</p></div>`
      : `<div class="coupon">
          <div class="coupon-label">Твоя скидка</div>
          <div class="coupon-sum">${state.win.percent}%</div>
          <div class="coupon-rows">
            <div>Для кого: <b>${esc(userTag())}</b></div>
            <div>Код: <b>${esc(state.win.code)}</b></div>
            <div>Действует до <b>${esc(dateText(state.win.until))}</b></div>
          </div>
          <div class="coupon-pick">На какую услугу возьмёшь?</div>
          <div class="picks">${services.map(s => `<button class="pick${chosenService === s.id ? " on" : ""}" data-pick="${esc(s.id)}">${esc(s.title)}</button>`).join("")}</div>
          <button class="btn" data-claim>Написать Маше</button>
          <div class="coupon-hint">Сделай скриншот этого экрана и пришли вместе с сообщением.</div>
        </div>`;
    return;
  }
  if (state.left <= 0) {
    const k = G.consolation;
    btn.style.display = "none";
    result.innerHTML = `<div class="sorry"><h4>${esc(k.title)}</h4><p>${esc(k.text)}</p>
      <button class="btn" data-url="${esc(messageUrl(k.message))}">${esc(k.button)}</button></div>`;
    return;
  }
  btn.style.display = "";
  result.innerHTML = "";
}

function plural(n) { return n === 1 ? "попытка" : "попытки"; }

function spin() {
  if (spinning || state.left <= 0 || state.win) return;
  spinning = true;
  haptic();
  const status = document.getElementById("status");
  const btn = document.getElementById("spin");
  const machine = document.getElementById("machine");
  status.textContent = "";
  btn.disabled = true;
  machine.classList.add("spinning");

  const outcome = pickOutcome();
  const shown = faces(outcome);
  state.left -= 1;
  state.played = true;
  if (outcome) {
    state.win = { percent: outcome, code: makeCode(outcome), until: Date.now() + G.daysValid * 864e5 };
  }
  saveState(); // сохраняем сразу, до окончания анимации
  document.getElementById("attempts").innerHTML = `Попытки ${Array.from({ length: G.attempts }, (_, i) => keySvg(i < state.left ? "" : "used")).join("")}`;

  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const times = calm ? [300, 400, 500] : [1100, 1600, 2200];
  shown.forEach((target, i) => {
    const { strip, distance } = setStrip(i, target, !calm);
    strip.getBoundingClientRect(); // чтобы браузер применил начальное положение
    strip.style.transition = `transform ${times[i]}ms cubic-bezier(.16,.84,.28,1)`;
    strip.style.transform = `translateY(-${distance}px)`;
  });

  setTimeout(() => {
    spinning = false;
    btn.disabled = false;
    machine.classList.remove("spinning");
    if (state.win) {
      haptic("win");
      status.textContent = "Есть совпадение!";
    } else if (state.left > 0) {
      status.textContent = `Не совпало. Осталось ${state.left} ${plural(state.left)}.`;
    } else {
      status.textContent = "";
    }
    renderGame();
    if (state.win || state.left <= 0) document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, times[2] + 80);
}

// Кнопки «Показать выигрыш / проигрыш»: начинаем заново и сразу крутим до нужного исхода
function showOutcome(percent) {
  if (spinning) return;
  resetGame();
  if (percent) { forced = percent; spin(); return; }
  state.left = 1; // проигрыш показываем с последней попытки, чтобы сразу был экран с утешением
  forced = 0;
  spin();
}
function resetGame() {
  state = { left: G.attempts, win: null, played: false };
  chosenService = null;
  saveState();
  document.getElementById("status").textContent = "";
  setInitialFaces();
  renderGame();
}
function setInitialFaces() { [30, 20, 10].forEach((p, i) => setStrip(i, p, false)); }

function bindEvents() {
  document.getElementById("spin").addEventListener("click", spin);
  document.addEventListener("click", e => {
    const claim = e.target.closest("[data-claim]");
    if (claim) {
      const svc = [...CONFIG.also, ...CONFIG.services].find(s => s.id === chosenService);
      const what = svc ? ` на «${svc.title}»` : "";
      openUrl(messageUrl(`Привет! Мне выпала скидка ${state.win.percent}%${what}. Код ${state.win.code}.`));
      return;
    }
    const pick = e.target.closest("[data-pick]");
    if (pick) { haptic(); chosenService = pick.dataset.pick; renderGame(); return; }
    const show = e.target.closest("[data-show]");
    if (show) { showOutcome(+show.dataset.show); return; }
    if (e.target.closest("[data-reset]")) { resetGame(); return; }

    const link = e.target.closest("[data-url]");
    if (link) { e.stopPropagation(); openUrl(link.dataset.url); return; }

    const go = e.target.closest("[data-go]");
    if (go) { haptic(); document.getElementById(go.dataset.go).scrollIntoView({ behavior: "smooth" }); return; }

    if (e.target.closest(".service-more")) return;
    const card = e.target.closest("[data-service]");
    if (card) {
      haptic();
      const open = card.classList.toggle("open");
      const label = card.querySelector("[data-label]");
      if (!label.dataset.closed) label.dataset.closed = label.textContent;
      label.textContent = open ? "Свернуть ↑" : label.dataset.closed;
    }
  });
}

function initTelegram() {
  if (!inTelegram) return;
  document.body.classList.add("in-tg");
  tg.ready();
  tg.expand();
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);
  tg.MainButton.setParams({
    text: CONFIG.bookingLabel,
    color: css.getPropertyValue("--main-btn").trim(),
    text_color: css.getPropertyValue("--main-btn-text").trim(),
  });
  tg.MainButton.onClick(() => openUrl(CONFIG.bookingUrl));
  tg.MainButton.show();
}

// Счётчик на экране ноутбука: растёт, когда очередная заявка опускается в экран
function startLaptop() {
  const num = document.getElementById("lap-num");
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const { start: first } = CONFIG.hero.laptop;
  let n = first;
  const tick = () => {
    n = n >= first + 30 ? first : n + 1;
    num.textContent = n;
    num.classList.remove("bump");
    void num.offsetWidth;
    num.classList.add("bump");
  };
  setTimeout(() => { tick(); setInterval(tick, 3000); }, 400 + 2900); // 31% от 9 секунд после задержки первой заявки
}

async function start() {
  render();
  bindEvents();
  initTelegram();
  startLaptop();
  setInitialFaces();
  const btn = document.getElementById("spin");
  btn.disabled = true;
  const saved = await loadState();
  if (saved) state = saved;
  btn.disabled = false;
  renderGame();
}
start();
</script>

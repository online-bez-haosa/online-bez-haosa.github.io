<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Мария · реклама ВКонтакте</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Marck+Script&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Цвета с карточек тарифов Маши: крем, песок, золото, тёмный шоколад */
    --bg: #F6EFE5;
    --sand: #EADCC9;
    --card: #FFFBF4;
    --line: rgba(122, 82, 38, .18);
    --text: #2E2118;
    --about: #5A4737;
    --muted: #7D6A57;
    --gold: #A67A3F;
    --gold-deep: #7A5226;
    --gold-light: #E9CFA0;
    --gold-text: linear-gradient(100deg, #6E4A20 0%, #B98E52 42%, #D9B981 55%, #7A5226 100%);
    --gold-frame: linear-gradient(135deg, #E9CFA0 0%, #A67A3F 38%, #F3E2C1 62%, #8A6230 100%);
    --btn: linear-gradient(100deg, #3A2A1E 0%, #5B412C 100%);
    --btn-text: #FBF0DE;
    --shadow: rgba(92, 63, 30, .18);
    --main-btn: #4A3424;
    --main-btn-text: #FBF0DE;
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); overflow-x: hidden; }
  body {
    color: var(--text); background: var(--bg);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size: 14.5px; line-height: 1.55; min-height: 100vh; overflow-x: hidden;
    font-variant-numeric: lining-nums; /* у Playfair цифры по умолчанию «пляшут», для цен нужны ровные */
  }
  #app { position: relative; max-width: 560px; margin: 0 auto; padding: 0 16px calc(96px + env(safe-area-inset-bottom)); }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; color: inherit; }
  .todo { background: rgba(214, 41, 92, .12); color: #B51D4C; border-radius: 4px; padding: 0 3px; }
  .serif { font-family: "Playfair Display", Georgia, serif; }

  /* ===== Шапка как на карточках тарифов: огромное золотое слово, фото поверх него, атлас ===== */
  .hero { position: relative; margin: 0 -16px; overflow: hidden; background: linear-gradient(170deg, #FBF5EC 0%, #F1E5D4 62%, var(--bg) 100%); }
  .satin { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .hero-stage { position: relative; height: 584px; }
  .hero-top { position: relative; z-index: 4; padding: 18px 16px 0; animation: rise .8s cubic-bezier(.2,.8,.3,1) backwards; }
  .hero-badges { display: flex; flex-wrap: wrap; gap: 6px; }
  .hero-badge { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 7px; border-radius: 999px; font-size: 13px; font-weight: 700; color: #F3DFB9; background: var(--btn); box-shadow: 0 6px 14px var(--shadow); }
  .hero-badge svg { width: 20px; height: 20px; }
  .hero-title {
    margin-top: 12px; font-family: "Playfair Display", Georgia, serif; font-weight: 700;
    font-size: clamp(34px, 10.4vw, 48px); line-height: 1.06; letter-spacing: -.01em;
  }
  .hero-title em {
    font-weight: 600; background: linear-gradient(100deg, #6E4A20 0%, #9C7238 35%, #C49A5C 50%, #9C7238 65%, #6E4A20 100%);
    background-size: 240% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 5s linear infinite;
  }
  /* Фото вырезано, снизу растворяется в фоне и едва заметно «дышит». drop-shadow сюда нельзя: маска его обрежет */
  .hero-figure {
    position: absolute; left: -24px; top: 186px; bottom: 0; z-index: 2; width: min(70vw, 330px); overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 80%, transparent 99%); mask-image: linear-gradient(180deg, #000 80%, transparent 99%);
    animation: rise 1s .15s cubic-bezier(.2,.8,.3,1) backwards;
  }
  .hero-figure img { display: block; width: 100%; height: auto; transform-origin: 40% 20%; animation: breathe 9s ease-in-out infinite alternate; }

  /* Коричневый развод за Машей */
  .swirl {
    position: absolute; left: -30px; top: 150px; z-index: 0; width: calc(100% + 60px); height: 430px; pointer-events: none; will-change: transform;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24%, #000 72%, transparent 100%); mask-image: linear-gradient(180deg, transparent 0, #000 24%, #000 72%, transparent 100%);
    transform-origin: 30% 50%; animation: drift 14s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: rotate(-2deg) translateX(-6px); } to { transform: rotate(2.5deg) translateX(8px); } }

  /* Телефон с рекламным кабинетом справа: заявки опускаются в экран, цифры растут.
     Три стиля: CONFIG.hero.phone.style или ?phone= в адресе (a светлый кабинет, b тёмный, c экран блокировки) */
  .phone {
    position: absolute; right: 18px; bottom: 30px; z-index: 3; width: 148px; height: 302px; padding: 3px; border-radius: 31px;
    background: var(--ph-frame);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5), inset 0 0 0 2px rgba(0, 0, 0, .12), 0 30px 40px -16px rgba(60, 38, 16, .6), 0 8px 16px rgba(60, 38, 16, .2);
    animation: rise 1s .35s cubic-bezier(.2,.8,.3,1) backwards;
  }
  .ph-btn { position: absolute; width: 3px; border-radius: 2px; background: var(--ph-btn); box-shadow: inset 0 0 0 .5px rgba(0, 0, 0, .2); }
  .ph-btn.a { left: -2px; top: 60px; height: 15px; }
  .ph-btn.v1 { left: -2px; top: 86px; height: 27px; }
  .ph-btn.v2 { left: -2px; top: 119px; height: 27px; }
  .ph-btn.p { right: -2px; top: 98px; height: 42px; }
  .ph-bezel { height: 100%; padding: 3px; border-radius: 28px; background: #0B0908; }
  .ph-screen { position: relative; height: 100%; overflow: hidden; border-radius: 25px; background: var(--ph-screen); color: var(--ph-ink); font-size: 9px; line-height: 1.25; }
  .ph-screen::after { content: ""; position: absolute; inset: 0; z-index: 10; pointer-events: none; background: linear-gradient(118deg, rgba(255, 255, 255, .24) 0%, rgba(255, 255, 255, .05) 30%, rgba(255, 255, 255, 0) 31%, rgba(255, 255, 255, 0) 100%); }
  .ph-island { position: absolute; top: 7px; left: 50%; z-index: 11; width: 38px; height: 11px; margin-left: -19px; border-radius: 6px; background: #000; }
  .ph-status { display: flex; justify-content: space-between; align-items: center; height: 25px; padding: 1px 12px 0 17px; font-size: 9px; font-weight: 700; }
  .ph-status svg { width: 30px; height: 9px; fill: currentColor; }
  .ph-app { padding: 2px 7px 0; }
  .ph-head { display: flex; justify-content: space-between; align-items: baseline; margin: 2px 2px 6px; }
  .ph-head b { font-size: 12px; font-weight: 700; }
  .ph-head span { font-size: 8px; font-weight: 600; opacity: .7; }
  .ph-card { padding: 6px 7px 7px; border-radius: 11px; background: var(--ph-card); box-shadow: var(--ph-card-shadow); }
  .ph-card small, .ph-lines small { display: block; font-size: 7.5px; font-weight: 600; opacity: .65; }
  .ph-card b { display: block; font-size: 11px; font-weight: 700; white-space: nowrap; }
  .ph-big { display: flex; align-items: center; gap: 5px; margin: 1px 0 3px; }
  .ph-big [data-ph="leads"] { font-family: "Playfair Display", Georgia, serif; font-size: 27px; font-weight: 700; line-height: 1; color: var(--ph-num); }
  .ph-plus { padding: 2px 5px; border-radius: 8px; font-style: normal; font-size: 8px; font-weight: 700; color: #3F7A3A; background: rgba(95, 160, 85, .16); opacity: 0; }
  .ph-plus.on { animation: phPlus 1.6s ease; }
  @keyframes phPlus { 0% { opacity: 0; transform: translateY(4px); } 15%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .ph-chart { display: block; width: 100%; height: auto; overflow: visible; }
  .ph-chart path { transition: d .8s ease; }
  .ph-chart circle { transition: cx .8s ease, cy .8s ease; }
  .ph-row { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 5px 0; }
  .ph-ad { display: flex; align-items: center; gap: 6px; }
  .ph-ad b { font-size: 9px; }
  .ph-live { flex: none; width: 6px; height: 6px; border-radius: 50%; background: #5FA055; box-shadow: 0 0 0 0 rgba(95, 160, 85, .5); animation: phLive 1.8s infinite; }
  @keyframes phLive { 70% { box-shadow: 0 0 0 5px rgba(95, 160, 85, 0); } 100% { box-shadow: 0 0 0 0 rgba(95, 160, 85, 0); } }
  .ph-bump { display: inline-block; animation: phBump .7s ease; }
  @keyframes phBump { 35% { transform: scale(1.14); } }

  /* B: тёмный кабинет, кольцо и столбики */
  .ph-on { display: flex; align-items: center; gap: 4px; }
  .ph-ring { position: relative; width: 104px; margin: 4px auto 6px; }
  .ph-ring svg { display: block; width: 100%; height: auto; }
  .ph-ring circle[data-ph="ring"] { transition: stroke-dashoffset .8s ease; }
  .ph-ring > div { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
  .ph-ring [data-ph="leads"] { font-family: "Playfair Display", Georgia, serif; font-size: 30px; font-weight: 700; line-height: 1; color: var(--ph-num); }
  .ph-ring small { font-size: 7.5px; font-weight: 600; opacity: .7; }
  .ph-bars { display: flex; align-items: flex-end; gap: 4px; height: 40px; margin: 0 4px; padding-bottom: 4px; border-bottom: 1px solid rgba(233, 207, 160, .18); }
  .ph-bars i { flex: 1; border-radius: 3px 3px 1px 1px; background: rgba(233, 207, 160, .35); transition: height .8s ease; }
  .ph-bars i:last-child { background: linear-gradient(180deg, #F3E2C1, #A67A3F); }
  .ph-lines { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 4px 0; }
  .ph-lines b { display: block; font-size: 12px; font-weight: 700; color: var(--ph-num); white-space: nowrap; }

  /* C: экран блокировки, сыплются уведомления */
  .ph-lock { padding: 6px 6px 0; text-align: center; }
  .ph-date { font-size: 8.5px; font-weight: 600; opacity: .85; }
  .ph-time { margin: 0 0 6px; font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
  .ph-widget { display: inline-flex; align-items: baseline; gap: 4px; padding: 3px 9px 4px; margin-bottom: 9px; border-radius: 10px; background: rgba(255, 248, 236, .22); font-size: 8px; font-weight: 600; }
  .ph-widget [data-ph="leads"] { font-size: 12px; font-weight: 700; }
  .ph-notes { display: grid; gap: 4px; text-align: left; }
  .ph-note { display: flex; gap: 5px; align-items: center; padding: 5px 6px; border-radius: 11px; background: rgba(255, 250, 242, .8); color: #2E2118; box-shadow: 0 4px 10px rgba(40, 24, 10, .18); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .ph-note.in { animation: phNote .6s cubic-bezier(.2,.8,.3,1); }
  .ph-note:nth-child(n+4) { display: none; }
  .ph-note:nth-child(3) { opacity: .75; transform: scale(.96); }
  .ph-note > div { flex: 1; min-width: 0; }
  .ph-note b { display: block; font-size: 8px; font-weight: 700; }
  .ph-note span { display: block; overflow: hidden; font-size: 7.5px; white-space: nowrap; text-overflow: ellipsis; opacity: .8; }
  .ph-note em { align-self: flex-start; font-style: normal; font-size: 6.5px; opacity: .6; }
  .ph-ic { flex: none; width: 17px; height: 17px; border-radius: 5px; display: grid; place-items: center; background: linear-gradient(135deg, #5B412C, #2E2118); }
  .ph-ic svg { width: 11px; height: 11px; }
  @keyframes phNote { from { opacity: 0; transform: translateY(-14px) scale(.9); } to { opacity: 1; transform: none; } }
  [data-phone="c"] .pop { display: none; }

  [data-phone="a"] .phone { --ph-frame: linear-gradient(135deg, #F5E8D0 0%, #C9A673 28%, #F8EDD8 50%, #A9855A 76%, #EAD6B2 100%); --ph-btn: #B9945F; --ph-screen: #FBF7F1; --ph-ink: #2E2118; --ph-num: #7A5226; --ph-card: #FFFFFF; --ph-card-shadow: 0 2px 6px rgba(80, 55, 25, .1); }
  [data-phone="b"] .phone { --ph-frame: linear-gradient(135deg, #77706A 0%, #2F2A26 30%, #625A53 52%, #1E1A17 78%, #4E4741 100%); --ph-btn: #35302B; --ph-screen: radial-gradient(130% 70% at 50% 0%, #46311F 0%, #1A110C 72%); --ph-ink: #F3E6D2; --ph-num: #F3DFB9; }
  [data-phone="c"] .phone { --ph-frame: linear-gradient(135deg, #F1E9DE 0%, #BDB09F 28%, #F6F0E7 50%, #9C8F7E 76%, #E2D8CA 100%); --ph-btn: #ADA08E; --ph-ink: #FFF8EC;
    --ph-screen: radial-gradient(90% 55% at 15% 12%, rgba(243, 226, 193, .95) 0%, rgba(243, 226, 193, 0) 70%), radial-gradient(80% 50% at 95% 55%, rgba(166, 122, 63, .9) 0%, rgba(166, 122, 63, 0) 70%), linear-gradient(170deg, #C9A673 0%, #7A5530 50%, #2E2118 100%); }
  [data-phone="c"] .ph-status { color: #FFF8EC; }
  [data-phone="c"] .ph-status span { visibility: hidden; }
  .ph-home { position: absolute; left: 50%; bottom: 5px; z-index: 11; width: 46px; height: 3px; margin-left: -23px; border-radius: 2px; background: var(--ph-ink); opacity: .55; }
  .ph-lockbtns { position: absolute; left: 12px; right: 12px; bottom: 16px; display: flex; justify-content: space-between; }
  .ph-lockbtns i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: rgba(30, 20, 12, .35); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  .ph-lockbtns svg { width: 11px; height: 11px; fill: none; stroke: #FFF8EC; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; }

  /* Заявки прилетают сверху и опускаются в экран */
  .pop {
    position: absolute; right: 12px; top: 196px; z-index: 5; width: 176px; display: flex; gap: 8px; align-items: center;
    padding: 7px 10px 7px 7px; border-radius: 15px; background: rgba(255, 251, 244, .97);
    box-shadow: 0 10px 22px rgba(70, 45, 20, .22); font-size: 12.5px; line-height: 1.25; font-weight: 600;
    opacity: 0; animation: fly 9s infinite;
  }
  .pop small { display: block; font-size: 10.5px; font-weight: 500; color: var(--muted); }
  .pop .ava { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--btn-text); background: var(--btn); }
  .pop .ava.gold { background: var(--gold-frame); color: var(--text); }
  .pop.p1 { animation-delay: .4s; }
  .pop.p2 { animation-delay: 3.4s; }
  .pop.p3 { animation-delay: 6.4s; }
  @keyframes fly {
    0% { opacity: 0; transform: translate(34px, -16px) scale(.9); }
    4%, 19% { opacity: 1; transform: none; }
    31% { opacity: 1; transform: translateY(112px) scale(.78); }
    35%, 100% { opacity: 0; transform: translateY(140px) scale(.4); }
  }

  /* Подпись возле фото */
  .hero-name { position: absolute; left: 14px; bottom: 16px; z-index: 4; padding: 6px 14px 8px; border-radius: 16px; line-height: 1; background: rgba(255, 251, 244, .94); box-shadow: 0 10px 24px rgba(70, 45, 20, .2); }
  .hero-name b { display: block; font-family: "Marck Script", cursive; font-size: 30px; font-weight: 400; color: var(--gold-deep); }
  .hero-name span { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; }

  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
  @keyframes breathe { from { transform: scale(1); } to { transform: scale(1.045); } }
  @keyframes shimmer { from { background-position: 120% 0; } to { background-position: -120% 0; } }
  @keyframes pop {
    0% { opacity: 0; transform: translateY(12px) scale(.94); }
    5%, 66% { opacity: 1; transform: none; }
    72%, 100% { opacity: 0; transform: translateY(-6px); }
  }
  .about { position: relative; margin-top: 14px; color: var(--about); font-size: 15px; line-height: 1.6; }
  .about b { color: var(--text); font-weight: 700; }

  /* Крупные цифры под рассказом о себе */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 16px; cursor: pointer; }
  .stat { padding: 11px 10px 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); }
  .stat b { display: block; font-family: "Playfair Display", Georgia, serif; font-size: 25px; font-weight: 700; line-height: 1.05; color: var(--gold-deep); white-space: nowrap; }
  .stat span { display: block; margin-top: 4px; font-size: 12px; line-height: 1.3; color: var(--about); }
  .stat.wide { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--btn); border-color: transparent; box-shadow: 0 12px 26px rgba(70, 45, 20, .22); }
  .stat.wide b { font-size: 34px; color: var(--gold-light); }
  .stat.wide span { margin: 0; font-size: 13px; color: #E8DAC7; }
  .stats-more { grid-column: 1 / -1; font-size: 13px; font-weight: 700; color: var(--gold-deep); text-align: center; }

  .nav {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 8px; overflow-x: auto;
    margin: 16px -16px 0; padding: 10px 16px;
    background: rgba(246, 239, 229, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; padding: 8px 15px; border-radius: 999px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    color: var(--gold-deep); background: var(--card); border: 1px solid var(--line);
  }
  .chip.hot { color: var(--btn-text); background: var(--btn); border-color: transparent; }
  .chip:active { background: var(--sand); }

  section { margin-top: 34px; scroll-margin-top: 62px; }
  h2 { font-family: "Playfair Display", Georgia, serif; font-size: 29px; font-weight: 700; line-height: 1.12; margin-bottom: 6px; }
  h2 em { font-weight: 600; color: var(--gold); }
  .h2-note { color: var(--muted); font-size: 14px; margin-bottom: 16px; }

  .btn {
    display: block; width: 100%; text-align: center; padding: 14px; border: 0; border-radius: 14px;
    background: var(--btn); color: var(--btn-text); font-size: 14.5px; font-weight: 700; cursor: pointer;
  }
  .btn:active { opacity: .88; }
  .btn.ghost { background: transparent; color: var(--gold-deep); border: 1px solid rgba(166, 122, 63, .55); }

  /* ===== Барабан ===== */
  .game-wrap { margin-top: 24px; padding: 1.5px; border-radius: 26px; background: var(--gold-frame); box-shadow: 0 16px 36px var(--shadow); scroll-margin-top: 62px; }
  .game { border-radius: 25px; padding: 20px 16px 18px; background: linear-gradient(165deg, #FFF9EF 0%, #F3E6D2 100%); }
  .game h3 { font-family: "Playfair Display", Georgia, serif; font-size: 27px; font-weight: 700; line-height: 1.12; text-align: center; }
  .game h3 em { font-weight: 600; color: var(--gold); }
  .game-text { margin-top: 8px; text-align: center; font-size: 14px; color: var(--about); }

  .machine { position: relative; margin-top: 16px; padding: 14px 12px; border-radius: 20px; background: var(--btn); box-shadow: inset 0 2px 10px rgba(0,0,0,.35); }
  .lamps { position: absolute; left: 22px; right: 22px; height: 5px; display: flex; justify-content: space-between; }
  .lamps.t { top: 5px; } .lamps.b { bottom: 5px; }
  .lamps i { width: 5px; height: 5px; border-radius: 50%; background: var(--gold-light); opacity: .45; }
  .machine.spinning .lamps i { animation: lamp .5s infinite; }
  .machine.spinning .lamps i:nth-child(even) { animation-delay: .25s; }
  .machine.won .lamps i { opacity: 1; box-shadow: 0 0 6px #FFE3A8; }
  @keyframes lamp { 0%, 100% { opacity: .25; } 50% { opacity: 1; box-shadow: 0 0 6px #FFE3A8; } }
  .reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .reel {
    position: relative; height: 86px; overflow: hidden; border-radius: 12px;
    background: linear-gradient(180deg, #E4D2B7 0%, #FFFBF4 28%, #FFFBF4 72%, #E4D2B7 100%);
  }
  .machine.won .reel { outline: 2px solid var(--gold-light); }
  .strip { will-change: transform; }
  .sym {
    height: 86px; display: grid; place-items: center;
    font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 31px; color: var(--text);
  }
  .sym.s30 { color: #8A5A1E; }
  .attempts { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .key { width: 28px; height: 15px; display: block; transition: opacity .3s; }
  .key.used { opacity: .22; filter: grayscale(1); }
  .game-status { min-height: 21px; margin-top: 8px; text-align: center; font-size: 14px; font-weight: 600; color: var(--gold-deep); }
  .spin-btn { margin-top: 8px; padding: 16px; font-size: 16px; }
  .spin-btn[disabled] { opacity: .55; cursor: default; }

  /* Купон */
  .coupon { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--card); border: 1.5px dashed var(--gold); text-align: center; }

<script>
/* --------- Служебное --------- */
const tg = window.Telegram && window.Telegram.WebApp;
const inTelegram = !!(tg && tg.platform && tg.platform !== "unknown");

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function haptic(kind) {
  if (!inTelegram || !tg.HapticFeedback) return;
  if (kind === "win") tg.HapticFeedback.notificationOccurred("success");
  else tg.HapticFeedback.impactOccurred("light");
}
// Ссылки на t.me: сначала закрываем приложение, иначе на iPhone оно останется поверх чата
function openUrl(url) {
  haptic();
  if (!inTelegram) { window.open(url, "_blank"); return; }
  if (url.startsWith("https://t.me/")) { tg.close(); tg.openTelegramLink(url); }
  else tg.openLink(url);
}
function messageUrl(text) { return ME + "?text=" + encodeURIComponent(text); }
function markTodos(root) {
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) if (/\[[^\]]+\]/.test(walker.currentNode.nodeValue)) nodes.push(walker.currentNode);
  nodes.forEach(node => {
    const span = document.createElement("span");
    span.innerHTML = esc(node.nodeValue).replace(/\[[^\]]+\]/g, m => `<span class="todo">${m}</span>`);
    node.replaceWith(...span.childNodes);
  });
}
const keySvg = (cls = "") => `<svg class="key ${cls}" viewBox="0 0 56 30" aria-hidden="true"><g fill="none" stroke="url(#goldKey)" stroke-width="4" stroke-linecap="round"><circle cx="13" cy="15" r="9.5"/><path d="M23 15h29M44 15v8M36 15v6"/></g></svg>`;

/* --------- Телефон с рекламным кабинетом --------- */
const rub = n => n.toLocaleString("ru-RU") + " ₽";
const PH_STATUS = `<div class="ph-status"><span data-ph="clock">9:41</span><svg viewBox="0 0 30 9"><rect x="0" y="6" width="2.4" height="3" rx=".6"/><rect x="3.4" y="4.5" width="2.4" height="4.5" rx=".6"/><rect x="6.8" y="3" width="2.4" height="6" rx=".6"/><rect x="10.2" y="1.5" width="2.4" height="7.5" rx=".6"/><rect x="15.5" y="1" width="12.5" height="7" rx="2" fill="none" stroke="currentColor" stroke-width=".9" opacity=".5"/><rect x="17" y="2.5" width="8.5" height="4" rx="1"/><rect x="28.6" y="3.6" width="1.2" height="2" rx=".5" opacity=".5"/></svg></div>`;

function phoneStyle() {
  const q = new URLSearchParams(location.search).get("phone");

function phoneReset() {
  const p = CONFIG.hero.phone;
  PH.leads = p.start;
  PH.spent = Math.round(p.start * p.cpl);
  PH.hist = Array.from({ length: 10 }, (_, i) => Math.round(p.start * (.5 + .5 * Math.pow(i / 9, .8))));

}

function phoneNote(i, isNew) {
  const n = CONFIG.hero.phone.notes[i % CONFIG.hero.phone.notes.length];

}

// Рисует текущие цифры на экране телефона
function phonePaint(bump) {
  const root = document.querySelector(".phone");
  if (!root) return;
  const all = k => root.querySelectorAll(`[data-ph="${k}"]`);
  const set = (k, v) => all(k).forEach(e => { e.textContent = v; });
  set("leads", PH.leads);
  set("spent", rub(PH.spent));
  set("cpl", rub(Math.round(PH.spent / PH.leads)));
  const now = new Date();
  set("clock", now.toLocaleTimeString("ru-RU", { hour: "numeric", minute: "2-digit" }));
  set("time", now.toLocaleTimeString("ru-RU", { hour: "numeric", minute: "2-digit" }));
  set("date", now.toLocaleDateString("ru-RU", { weekday: "long", day: "numeric", month: "long" }));
  // A: линия графика
  const line = root.querySelector('[data-ph="line"]');
  if (line) {
    const h = PH.hist, min = Math.min(...h), max = Math.max(...h), W = 100, H = 34;
    const pts = h.map((v, i) => [2 + i * W / (h.length - 1), H - 3 - (v - min) / Math.max(1, max - min) * (H - 10)]);
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    line.setAttribute("d", d);
    root.querySelector('[data-ph="area"]').setAttribute("d", d + ` L${W + 2} ${H} L2 ${H} Z`);
    const dot = root.querySelector('[data-ph="dot"]'), last = pts[pts.length - 1];
    dot.setAttribute("cx", last[0].toFixed(1));
    dot.setAttribute("cy", last[1].toFixed(1));
  }
  // B: кольцо до 100 заявок и столбики по часам
  const ring = root.querySelector('[data-ph="ring"]');
  if (ring) ring.style.strokeDashoffset = (207.3 * (1 - PH.leads / 100)).toFixed(1);
  const bars = root.querySelectorAll(".ph-bars i"), top = Math.max(16, ...PH.bars);
  bars.forEach((b, i) => { b.style.height = (PH.bars[i] / top * 100).toFixed(0) + "%"; });
  if (!bump) return;
  all("leads").forEach(e => { e.classList.remove("ph-bump"); void e.offsetWidth; e.classList.add("ph-bump"); });
  const plus = root.querySelector(".ph-plus");
  if (plus) { plus.classList.remove("on"); void plus.offsetWidth; plus.classList.add("on"); }
  // C: новое уведомление сверху, старые уезжают вниз
  const notes = root.querySelector('[data-ph="notes"]');
  if (notes) {
    PH.note++;
    notes.insertAdjacentHTML("afterbegin", phoneNote(PH.note + 2, true));
    while (notes.children.length > 4) notes.lastElementChild.remove();
    [...notes.children].forEach((n, i) => { if (i) n.querySelector("em").textContent = i * 3 + " мин"; });
  }
}

function phoneTick() {
  const p = CONFIG.hero.phone;
  if (PH.leads >= p.end) phoneReset();
  else {
    PH.leads++;
    PH.spent += Math.round(p.cpl - 4 + Math.random() * 8);
    PH.hist.push(PH.leads); PH.hist.shift();
    PH.bars[PH.bars.length - 1] += 2;
    if (PH.bars[PH.bars.length - 1] > 15) { PH.bars.shift(); PH.bars.push(2); }
  }
  phonePaint(true);
}

    <section id="cases">
      <h2>Кейсы: сколько заявок <em>принесла реклама</em></h2>
      <p class="h2-note">Цифры из рекламных кабинетов моих клиентов ВКонтакте.</p>
      ${c.cases.map(k => `<div class="case">
        <div class="case-head">${esc(k.head)}</div>
        <div class="case-flow">
          <div><small>потратили</small><div class="case-spent">${esc(k.spent)}</div></div>
          <div class="case-arrow" aria-hidden="true">→</div>
          <div><small>получили</small><div class="case-got">${esc(k.got)}</div></div>
        </div>
        ${k.sales ? `<div class="case-sales">${esc(k.sales)}</div>` : ""}
        <div class="case-note">${esc(k.note)}</div>
      </div>`).join("")}
      <p class="cases-note">${esc(c.casesNote)}</p>
      ${c.caseLinks.map(l => `<a class="link-row" data-url="${esc(l.url)}">${esc(l.label)}</a>`).join("")}
    </section>

    <section id="reviews">
      <h2>Что <em>пишут</em></h2>
      ${c.reviews.length > 1 ? `<p class="h2-note">Листай вбок.</p>` : ""}
      <div class="reviews">
        ${c.reviews.map(x => `<div class="review"><div class="quote">“</div><p>${esc(x.text)}</p><div class="who">${esc(x.who)}</div></div>`).join("")}
      </div>

    <section class="remote" id="remote">
      <div class="remote-head">
        <div class="remote-photo"><img src="${esc(r.photo)}" alt="Мария" loading="lazy"></div>
        <h2>${r.title}</h2>
      </div>
      <p class="remote-text">${esc(r.text)}</p>
      <div class="key-offer" data-url="${esc(messageUrl(r.key.message))}">
        <svg viewBox="0 0 56 30" aria-hidden="true"><g fill="none" stroke="url(#goldKey)" stroke-width="4" stroke-linecap="round"><circle cx="13" cy="15" r="9.5"/><path d="M23 15h29M44 15v8M36 15v6"/></g></svg>
        <div><b>${esc(r.key.title)}</b><span>${esc(r.key.text)}</span></div>
      </div>
      <div class="tariffs-title">${esc(r.tariffsTitle)}</div>
      ${r.tariffs.map(t => serviceCard({ ...t, openLabel: "Смотреть, что внутри ↓", button: r.button, ask: "Привет! Интересует: " + t.sub }, true)).join("")}
      <button class="btn ghost" style="margin-top:6px" data-url="${esc(messageUrl(r.message))}">Пока не знаю, что выбрать</button>
    </section>

    <section id="useful">
      <h2>Полезное <em>почитать</em></h2>
      <p class="h2-note">Посты откроются в канале ↗</p>
      ${c.useful.map(u => `
        <div class="useful-group">${esc(u.title)}</div>
        <div class="list">
          ${u.items.map(p => `<div class="item" data-url="${esc(p.url)}">
            <div class="item-icon">${icon(p.icon)}</div>
            <div class="item-main"><div class="item-title">${esc(p.title)}</div><div class="item-desc">${esc(p.desc)}</div></div>
            <div class="item-arrow">›</div>
          </div>`).join("")}
        </div>`).join("")}

    <footer>
      <p>${esc(c.footerNote)}</p>
      <p>${c.footerLinks.map(l => `<a data-url="${esc(l.url)}">${esc(l.label)}</a>`).join(" · ")}</p>
    </footer>

    <div class="sticky-cta"><button class="btn" data-url="${esc(c.bookingUrl)}">${esc(c.bookingLabel)}</button></div>
  `;
  markTodos(document.getElementById("app"));
}

/* --------- Барабан ---------
   Результат выбирается ДО вращения и сразу сохраняется, поэтому закрыть приложение
   посреди кручения и вернуть попытку нельзя. В Telegram всё лежит в облаке (CloudStorage),
   у каждого человека своё, переустановка не помогает. В обычном браузере такой памяти нет,
   поэтому с demo: false играть можно только внутри Telegram. */
const G = CONFIG.game;
const STORE_KEY = "game_" + G.gameId;
const REEL_H = 86;
let state = { left: G.attempts, win: null, played: false };
let forced = null; // только для просмотра: что выпадет на следующем кручении
let spinning = false;
let chosenService = null;

const cloud = inTelegram && tg.isVersionAtLeast && tg.isVersionAtLeast("6.9") && tg.CloudStorage;

function loadState() {
  return new Promise(resolve => {
    const local = () => { try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; } };
    if (!cloud) return resolve(local());
    cloud.getItem(STORE_KEY, (err, val) => {
      if (err || !val) return resolve(local());
      try { resolve(JSON.parse(val)); } catch (e) { resolve(local()); }
    });
  });
}
function saveState() {
  const s = JSON.stringify(state);
  try { localStorage.setItem(STORE_KEY, s); } catch (e) {}
  if (cloud) cloud.setItem(STORE_KEY, s);
}

function pickOutcome() {
  if (forced !== null) { const f = forced; forced = null; return f; }
  let r = Math.random();
  for (const p of G.symbols) { if (r < G.odds[p]) return p; r -= G.odds[p]; }
  return 0;
}
function rnd(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function faces(outcome) {
  if (outcome) return [outcome, outcome, outcome];
  // Не совпало: случайные числа, но не три одинаковых
  let f;
  do { f = [rnd(G.symbols), rnd(G.symbols), rnd(G.symbols)]; } while (f[0] === f[1] && f[1] === f[2]);
  return f;
}
const symHtml = p => `<div class="sym s${p}">${p}%</div>`;

function setStrip(i, target, long) {
  const strip = document.getElementById("strip" + i);
  const before = [];
  const count = long ? 14 + i * 6 : 0;
  for (let k = 0; k < count; k++) before.push(rnd(G.symbols));
  strip.style.transition = "none";
  strip.style.transform = "translateY(0)";
  strip.innerHTML = [...before, target].map(symHtml).join("");
  return { strip, distance: count * REEL_H };
}

function userTag() {
  const u = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user;
  if (!u) return "твой ник в Telegram";
  return u.username ? "@" + u.username : [u.first_name, u.last_name].filter(Boolean).join(" ");
}
function makeCode(percent) {
  const u = inTelegram && tg.initDataUnsafe && tg.initDataUnsafe.user;
  const base = u ? u.id : Math.floor(Math.random() * 1e9);
  return "OBH-" + percent + "-" + Number(base).toString(36).toUpperCase().slice(-5);
}
const dateText = ts => new Date(ts).toLocaleDateString("ru-RU", { day: "numeric", month: "long" });

function renderGame() {
  document.getElementById("attempts").innerHTML = `Попытки ${Array.from({ length: G.attempts }, (_, i) => keySvg(i < state.left ? "" : "used")).join("")}`;
  const btn = document.getElementById("spin");
  const result = document.getElementById("result");
  const machine = document.getElementById("machine");
  machine.classList.toggle("won", !!state.win);

  if (!inTelegram && !G.demo) {
    btn.style.display = "none";
    result.innerHTML = `<div class="sorry"><h4>Играть можно в Telegram</h4><p>Так барабан запомнит твои попытки.</p></div>`;
    return;
  }
  if (state.win) {
    btn.style.display = "none";
    const expired = Date.now() > state.win.until;
    const services = [...CONFIG.also, ...CONFIG.services];
    result.innerHTML = expired
      ? `<div class="sorry"><h4>Срок скидки закончился</h4><p>Она действовала до ${esc(dateText(state.win.until))}. Напиши мне, если всё ещё актуально.</p></div>`
      : `<div class="coupon">
          <div class="coupon-label">Твоя скидка</div>
          <div class="coupon-sum">${state.win.percent}%</div>
          <div class="coupon-rows">
            <div>Для кого: <b>${esc(userTag())}</b></div>
            <div>Код: <b>${esc(state.win.code)}</b></div>
            <div>Действует до <b>${esc(dateText(state.win.until))}</b></div>
          </div>
          <div class="coupon-pick">На какую услугу возьмёшь?</div>
          <div class="picks">${services.map(s => `<button class="pick${chosenService === s.id ? " on" : ""}" data-pick="${esc(s.id)}">${esc(s.title)}</button>`).join("")}</div>
          <button class="btn" data-claim>Написать мне</button>
          <div class="coupon-hint">Сделай скриншот этого экрана и пришли вместе с сообщением.</div>
        </div>`;
    return;
  }
  if (state.left <= 0) {
    const k = G.consolation;
    btn.style.display = "none";
    result.innerHTML = `<div class="sorry"><h4>${esc(k.title)}</h4><p>${esc(k.text)}</p>
      <button class="btn" data-url="${esc(messageUrl(k.message))}">${esc(k.button)}</button></div>`;
    return;
  }
  btn.style.display = "";
  result.innerHTML = "";
}

function plural(n) { return n === 1 ? "попытка" : "попытки"; }

function spin() {
  if (spinning || state.left <= 0 || state.win) return;
  spinning = true;
  haptic();
  const status = document.getElementById("status");
  const btn = document.getElementById("spin");
  const machine = document.getElementById("machine");
  status.textContent = "";
  btn.disabled = true;
  machine.classList.add("spinning");

  const outcome = pickOutcome();
  const shown = faces(outcome);
  state.left -= 1;
  state.played = true;
  if (outcome) {
    state.win = { percent: outcome, code: makeCode(outcome), until: Date.now() + G.daysValid * 864e5 };
  }
  saveState(); // сохраняем сразу, до окончания анимации
  document.getElementById("attempts").innerHTML = `Попытки ${Array.from({ length: G.attempts }, (_, i) => keySvg(i < state.left ? "" : "used")).join("")}`;

  const calm = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const times = calm ? [300, 400, 500] : [1100, 1600, 2200];
  shown.forEach((target, i) => {
    const { strip, distance } = setStrip(i, target, !calm);
    strip.getBoundingClientRect(); // чтобы браузер применил начальное положение
    strip.style.transition = `transform ${times[i]}ms cubic-bezier(.16,.84,.28,1)`;
    strip.style.transform = `translateY(-${distance}px)`;
  });

  setTimeout(() => {
    spinning = false;
    btn.disabled = false;
    machine.classList.remove("spinning");
    if (state.win) {
      haptic("win");
      status.textContent = "Есть совпадение!";
    } else if (state.left > 0) {
      status.textContent = `Не совпало. Осталось ${state.left} ${plural(state.left)}.`;
    } else {
      status.textContent = "";
    }
    renderGame();
    if (state.win || state.left <= 0) document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }, times[2] + 80);
}

// Кнопки «Показать выигрыш / проигрыш»: начинаем заново и сразу крутим до нужного исхода
function showOutcome(percent) {
  if (spinning) return;
  resetGame();
  if (percent) { forced = percent; spin(); return; }
  state.left = 1; // проигрыш показываем с последней попытки, чтобы сразу был экран с утешением
  forced = 0;
  spin();
}
function resetGame() {
  state = { left: G.attempts, win: null, played: false };
  chosenService = null;
  saveState();
  document.getElementById("status").textContent = "";
  setInitialFaces();
  renderGame();
}
function setInitialFaces() { [30, 20, 10].forEach((p, i) => setStrip(i, p, false)); }

function bindEvents() {
  document.getElementById("spin").addEventListener("click", spin);
  document.addEventListener("click", e => {
    const claim = e.target.closest("[data-claim]");
    if (claim) {
      const svc = [...CONFIG.also, ...CONFIG.services].find(s => s.id === chosenService);
      const what = svc ? ` на «${svc.title}»` : "";
      openUrl(messageUrl(`Привет! Мне выпала скидка ${state.win.percent}%${what}. Код ${state.win.code}.`));
      return;
    }
    const pick = e.target.closest("[data-pick]");
    if (pick) { haptic(); chosenService = pick.dataset.pick; renderGame(); return; }
    const show = e.target.closest("[data-show]");
    if (show) { showOutcome(+show.dataset.show); return; }
    if (e.target.closest("[data-reset]")) { resetGame(); return; }

    const link = e.target.closest("[data-url]");
    if (link) { e.stopPropagation(); openUrl(link.dataset.url); return; }

    const go = e.target.closest("[data-go]");
    if (go) { haptic(); document.getElementById(go.dataset.go).scrollIntoView({ behavior: "smooth" }); return; }

    if (e.target.closest(".service-more")) return;
    const card = e.target.closest("[data-service]");
    if (card) {
      haptic();
      const open = card.classList.toggle("open");
      const label = card.querySelector("[data-label]");
      if (!label.dataset.closed) label.dataset.closed = label.textContent;
      label.textContent = open ? "Свернуть ↑" : label.dataset.closed;
    }
  });
}

function initTelegram() {
  if (!inTelegram) return;
  document.body.classList.add("in-tg");
  tg.ready();
  tg.expand();
  const css = getComputedStyle(document.documentElement);
  const bg = css.getPropertyValue("--bg").trim();
  tg.setHeaderColor(bg);
  tg.setBackgroundColor(bg);
  tg.MainButton.setParams({
    text: CONFIG.bookingLabel,
    color: css.getPropertyValue("--main-btn").trim(),
    text_color: css.getPropertyValue("--main-btn-text").trim(),
  });
  tg.MainButton.onClick(() => openUrl(CONFIG.bookingUrl));
  tg.MainButton.show();
}

// Счётчик на экране телефона: растёт, когда очередная заявка опускается в экран
function startPhone() {
  phoneReset();
  phonePaint(false);
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  setTimeout(() => { phoneTick(); setInterval(phoneTick, 3000); }, 400 + 2790); // 31% от 9 секунд после задержки первой заявки
}

async function start() {
  render();
  bindEvents();
  initTelegram();
  startPhone();
  setInitialFaces();
  const btn = document.getElementById("spin");
  btn.disabled = true;
  const saved = await loadState();
  if (saved) state = saved;
  btn.disabled = false;
  renderGame();
}
start();
</script>
